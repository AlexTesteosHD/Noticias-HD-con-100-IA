<section>

    <div class="titulo-seccion">

        <span>CONTACTO</span>

        <h2>
            Ponte en contacto
        </h2>

        <p>
            Envíanos tus comentarios, sugerencias o noticias.
        </p>

    </div>


    <form class="formulario">

        <div class="form-grupo">

            <label for="nombre">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Escribe tu nombre">

        </div>


        <div class="form-grupo">

            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="correo@ejemplo.com">

        </div>


        <div class="form-grupo">

            <label for="asunto">
                Asunto
            </label>

            <input
                type="text"
                id="asunto"
                name="asunto"
                placeholder="Asunto del mensaje">

        </div>


        <div class="form-grupo">

            <label for="mensaje">
                Mensaje
            </label>

            <textarea
                id="mensaje"
                name="mensaje"
                rows="7"
                placeholder="Escribe tu mensaje..."></textarea>

        </div>


        <button type="submit">
            Enviar mensaje →
        </button>

    </form>

</section>
